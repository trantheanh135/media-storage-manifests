---
# Ingress (requires ingress controller installed)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-storage-ingress
  namespace: media-storage
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod  # Optional: if using cert-manager
spec:
  rules:
  - host: media-storage.192.168.1.100.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080

  # Optional: TLS configuration (if using cert-manager)
  # tls:
  # - hosts:
  #   - media-storage.192.168.1.100.nip.io
  #   secretName: media-storage-tls
