---
# Backend Service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: media-storage
  labels:
    app: backend
spec:
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: backend
  type: ClusterIP

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: media-storage
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Change this to your actual image (build and push to registry first)
        image: your-registry/media-storage-backend:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8080
          name: http

        envFrom:
        - configMapRef:
            name: media-storage-config
        - secretRef:
            name: media-storage-secret

        volumeMounts:
        - name: uploads
          mountPath: /home/uploads

        livenessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 1
          failureThreshold: 3

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

      volumes:
      - name: uploads
        persistentVolumeClaim:
          claimName: uploads-pvc
