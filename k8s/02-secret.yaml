apiVersion: v1
kind: Secret
metadata:
  name: media-storage-secret
  namespace: media-storage
type: Opaque
data:
  # PostgreSQL (base64 encoded)
  # postgres / postgres
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=

  # Spring Datasource
  SPRING_DATASOURCE_USERNAME: cG9zdGdyZXM=
  SPRING_DATASOURCE_PASSWORD: cG9zdGdyZXM=

---
# Note: To create these secrets from command line:
# kubectl create secret generic media-storage-secret \
#   --from-literal=POSTGRES_USER=postgres \
#   --from-literal=POSTGRES_PASSWORD=postgres \
#   -n media-storage

# Or update values in base64:
# echo -n "your-value" | base64

# JWT_SECRET is NOT stored here (this file is public) - see generate-jwt-secret.sh
