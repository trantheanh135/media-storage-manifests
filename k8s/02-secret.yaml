apiVersion: v1
kind: Secret
metadata:
  name: media-storage-secret
  namespace: media-storage
type: Opaque
data:
  # PostgreSQL (base64 encoded)
  # postgres / postgres
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=

  # Keycloak Admin
  # admin / admin123
  KEYCLOAK_ADMIN: YWRtaW4=
  KEYCLOAK_ADMIN_PASSWORD: YWRtaW4xMjM=

  # Keycloak Client Secret (CHANGE THIS!)
  # Replace with your actual client secret from Keycloak
  KEYCLOAK_CREDENTIALS_SECRET: eW91ci1jbGllbnQtc2VjcmV0LWhlcmU=

  # Spring Datasource
  SPRING_DATASOURCE_USERNAME: cG9zdGdyZXM=
  SPRING_DATASOURCE_PASSWORD: cG9zdGdyZXM=

---
# Note: To create these secrets from command line:
# kubectl create secret generic media-storage-secret \
#   --from-literal=POSTGRES_USER=postgres \
#   --from-literal=POSTGRES_PASSWORD=postgres \
#   --from-literal=KEYCLOAK_ADMIN=admin \
#   --from-literal=KEYCLOAK_ADMIN_PASSWORD=admin123 \
#   --from-literal=KEYCLOAK_CREDENTIALS_SECRET=<actual-secret> \
#   -n media-storage

# Or update values in base64:
# echo -n "your-value" | base64
